---
# Docker maintenance playbook for pruning and health checks
# Runs weekly to clean up unused Docker resources
- name: Docker maintenance - Prune and health checks
  hosts: "{{ target_host | default('all') }}"
  connection: local
  become: true

  tasks:
    - name: Run Docker maintenance tasks
      ansible.builtin.import_role:
        name: maintenance
        tasks_from: docker_maintenance
