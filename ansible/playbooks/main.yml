---
# Main playbook for ansible-pull
# Designed for automated configuration management via ansible-pull
- name: Provision and configure servers
  hosts: "{{ target_host | default('all') }}"
  become: true

  pre_tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
      tags: always

    # geerlingguy.docker only refreshes the apt cache via a handler when it
    # (re)writes the Docker repository file. If the repo file already exists
    # from an earlier (possibly interrupted) run, that handler never fires and
    # the Docker packages can be missing from the cache, causing
    # "No package matching 'docker-ce' is available". Force an unconditional
    # refresh whenever the repo file is already present so the Docker packages
    # are always indexed before the role installs them.
    - name: Check whether the Docker apt repository is already configured
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/docker.sources
      register: docker_apt_repo_file
      when: ansible_os_family == "Debian"
      tags: always

    - name: Refresh apt cache so an existing Docker repository is indexed
      ansible.builtin.apt:
        update_cache: true
      when:
        - ansible_os_family == "Debian"
        - docker_apt_repo_file.stat.exists | default(false)
      tags: always

    - name: Unhold managed apt packages before role execution
      ansible.builtin.include_role:
        name: apt_hold
        tasks_from: unhold.yml
      when: ansible_os_family == "Debian"
      tags: always

  roles:
    - role: github_ssh_keys
      when: "'github_ssh_keys' in server_features"
      tags: [github_ssh_keys, ssh]

    - role: system_setup
      when: "'system_setup' in server_features"
      tags: [system_setup, base]

    - role: docker_group
      when: "'docker' in server_features"
      tags: [docker, docker_group]

    - role: geerlingguy.docker
      when: "'docker' in server_features"
      tags: docker

    - role: apt_hold
      when: ansible_os_family == "Debian"
      tags: [apt_hold]

    - role: ufw
      when: "'ufw' in server_features or 'firewall' in server_features"
      tags: [ufw, firewall]

    - role: package_managers
      when: "'package_managers' in server_features"
      tags: [package_managers, homebrew]

    - role: chezmoi
      when: "'chezmoi' in server_features"
      tags: chezmoi

    - role: docker_compose_modules
      when: "compose_modules is defined and compose_modules | length > 0"
      tags: [docker_compose, services]

    - role: ansible_pull_setup
      when: "'ansible_pull_setup' in server_features"
      tags: [ansible_pull, automation]

    - role: maintenance
      when: "'maintenance' in server_features"
      tags: [maintenance, automation]

    - role: packages
      when: "'packages' in server_features"
      tags: [packages]

    - role: git_repos
      when: "'git_repos' in server_features and git_repos | default([]) | length > 0"
      tags: [git_repos]

    - role: devcontainer_prebuild
      when: "'devcontainer_prebuild' in server_features"
      tags: [devcontainer_prebuild]

    - role: cron_jobs
      when: "'cron_jobs' in server_features and cron_jobs | default([]) | length > 0"
      tags: [cron_jobs]
