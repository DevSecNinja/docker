---
# Unhold packages so Ansible can manage their versions

- name: Unhold managed apt packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ apt_hold_packages }}"
  when: apt_hold_packages | length > 0
  register: apt_unhold_result
  until: apt_unhold_result is not failed
  retries: "{{ apt_hold_lock_retries }}"
  delay: "{{ apt_hold_lock_delay }}"
  failed_when:
    - apt_unhold_result.failed
    - "'Failed to find package' not in (apt_unhold_result.msg | default(''))"
  tags: [apt_hold]
