---
# Main entry point: hold all managed packages

- name: Hold managed apt packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ apt_hold_packages }}"
  when: apt_hold_packages | length > 0
  register: apt_hold_result
  until: apt_hold_result is not failed
  retries: "{{ apt_hold_lock_retries }}"
  delay: "{{ apt_hold_lock_delay }}"
  failed_when:
    - apt_hold_result.failed
    - "'Failed to find package' not in (apt_hold_result.msg | default(''))"
  tags: [apt_hold]
