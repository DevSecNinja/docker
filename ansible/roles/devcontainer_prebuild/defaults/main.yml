---
# Default variables for Devcontainer Prebuild role

# User to run devcontainer builds as
devcontainer_prebuild_user: "{{ ansible_user }}"

# Directory containing cloned git repositories to scan
devcontainer_prebuild_projects_dir: "/home/{{ devcontainer_prebuild_user }}/projects"

# Directory for the default devcontainer config (for repos without .devcontainer/)
devcontainer_prebuild_config_dir: "/home/{{ devcontainer_prebuild_user }}/.config/devcontainer-default"

# Paths for the split build + up scripts (system-wide, readable by systemd)
devcontainer_build_script: /usr/local/bin/devcontainer-build.sh
devcontainer_up_script: /usr/local/bin/devcontainer-up.sh

# Systemd timer schedule (OnCalendar format, default: weekly on Monday at 06:00)
# Runs after the Docker maintenance prune (monthly) to keep images fresh.
devcontainer_prebuild_calendar: "Mon *-*-* 06:00:00"

# Default devcontainer image for repos without a .devcontainer/ folder
devcontainer_default_image: "mcr.microsoft.com/devcontainers/base:debian"

# Standalone devcontainer CLI install directory and script URL
devcontainer_cli_install_dir: "/home/{{ devcontainer_prebuild_user }}/.devcontainers/bin"
devcontainer_cli_install_script_url: "https://raw.githubusercontent.com/devcontainers/cli/main/scripts/install.sh"

# Homebrew prefix (Linux default - matches package_managers role)
homebrew_prefix: "/home/linuxbrew/.linuxbrew"

# Idle-stop: stop running devcontainers that have been up longer than this threshold.
# The systemd timer runs every hour; containers running >= this many seconds are stopped.
devcontainer_idle_stop_threshold_seconds: 3600

# Path for the idle-stop script (system-wide, readable by systemd)
devcontainer_stop_script: /usr/local/bin/devcontainer-stop.sh
