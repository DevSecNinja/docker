---
# Default variables for Chezmoi role
chezmoi_version: "latest"
# Architecture mapping for Chezmoi binary download
chezmoi_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
chezmoi_install_path: "/usr/local/bin/chezmoi"
chezmoi_repo_url: "https://github.com/DevSecNinja/dotfiles.git"
chezmoi_user: "{{ ansible_user }}"
chezmoi_init_apply: true
# Prefer installing/upgrading Chezmoi via Homebrew when brew is present.
# Only takes effect when chezmoi_version is 'latest' (Homebrew always tracks
# the latest formula); a pinned chezmoi_version always uses the direct
# GitHub binary download. Set to false to never use Homebrew.
chezmoi_prefer_brew: true
# Homebrew brew binary and the user that owns the Homebrew prefix. Defaults
# mirror the package_managers role so both use the same brew installation.
chezmoi_brew_binary: "/home/linuxbrew/.linuxbrew/bin/brew"
chezmoi_brew_user: "{{ homebrew_user | default(ansible_user) }}"
