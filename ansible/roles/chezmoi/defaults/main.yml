---
# Default variables for Chezmoi role
chezmoi_version: "latest"
# Architecture mapping for Chezmoi binary download
chezmoi_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
chezmoi_install_path: "/usr/local/bin/chezmoi"
chezmoi_repo_url: "https://github.com/DevSecNinja/dotfiles.git"
chezmoi_user: "{{ ansible_user }}"
chezmoi_init_apply: true
