---
# Tasks for Git Repos role

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
  register: git_apt_result
  retries: 10
  delay: 30
  until: git_apt_result is succeeded
  tags: [git_repos]

- name: Clone or update git repositories (single-repo format)
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('main') }}"
    update: true
  loop: "{{ git_repos | selectattr('repo', 'defined') | list }}"
  tags: [git_repos]

- name: Clone or update git repositories (multi-repo format)
  ansible.builtin.git:
    repo: "{{ item.1 }}"
    dest: "{{ item.0.dest }}/{{ item.1 | basename }}"
    version: "{{ item.0.version | default('main') }}"
    update: true
  loop: "{{ git_repos | selectattr('repos', 'defined') | list | subelements('repos') }}"
  tags: [git_repos]

- name: Set ownership of git repositories (single-repo format)
  ansible.builtin.file:
    path: "{{ item.dest }}"
    owner: "{{ item.user | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
    recurse: true
  loop: "{{ git_repos | selectattr('repo', 'defined') | list }}"
  tags: [git_repos]

- name: Set ownership of git repositories (multi-repo format)
  ansible.builtin.file:
    path: "{{ item.0.dest }}/{{ item.1 | basename }}"
    owner: "{{ item.0.user | default(ansible_user) }}"
    group: "{{ item.0.group | default(ansible_user) }}"
    recurse: true
  loop: "{{ git_repos | selectattr('repos', 'defined') | list | subelements('repos') }}"
  tags: [git_repos]

- name: Mark git repositories as safe directories (single-repo format)
  community.general.git_config:
    name: safe.directory
    value: "{{ item.dest }}"
    scope: system
  loop: "{{ git_repos | selectattr('repo', 'defined') | list }}"
  tags: [git_repos]

- name: Mark git repositories as safe directories (multi-repo format)
  community.general.git_config:
    name: safe.directory
    value: "{{ item.0.dest }}/{{ item.1 | basename }}"
    scope: system
  loop: "{{ git_repos | selectattr('repos', 'defined') | list | subelements('repos') }}"
  tags: [git_repos]
