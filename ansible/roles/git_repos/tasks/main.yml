---
# Tasks for Git Repos role

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
  register: git_apt_result
  retries: 10
  delay: 30
  until: git_apt_result is succeeded
  tags: [git_repos]

- name: Clone or update git repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('main') }}"
    update: true
  loop: "{{ git_repos }}"
  tags: [git_repos]

- name: Set ownership of git repositories to ansible user
  ansible.builtin.file:
    path: "{{ item.dest }}"
    owner: "{{ item.user | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
    recurse: true
  loop: "{{ git_repos }}"
  tags: [git_repos]

- name: Mark git repositories as safe directories
  community.general.git_config:
    name: safe.directory
    value: "{{ item.dest }}"
    scope: system
  loop: "{{ git_repos }}"
  tags: [git_repos]
