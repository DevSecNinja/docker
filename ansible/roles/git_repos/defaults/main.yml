---
# Default variables for Git Repos role

# List of repositories to set up. Each repository is created as an empty "shim"
# (an initialised git repo with the remote and branch tracking configured but no
# content fetched); run `git pull` inside the directory to populate it. Once a
# repository has been populated, subsequent runs fast-forward it to the latest
# upstream commit (only when the checked-out branch tracks an upstream and can
# fast-forward, so local work is never disturbed). Three formats are supported:
#
# Single-repo format (shim created directly at dest):
# git_repos:
#   - repo: "https://github.com/example/repo"
#     dest: "/opt/repo"
#     version: main  # optional, defaults to HEAD (remote default branch)
#     user: myuser
#     group: myuser
#
# Multi-repo format (each repo cloned into dest/<repo-name>):
# git_repos:
#   - repos:
#       - "https://github.com/example/repo-a"
#       - "https://github.com/example/repo-b"
#     dest: "/home/myuser/projects"
#     version: main  # optional, defaults to HEAD (remote default branch)
#     user: myuser
#     group: myuser
#
# GitHub-user format (enumerate a handle's repos via the GitHub API and clone
# each non-archived public repo into dest/<repo-name>):
# git_repos:
#   - github_user: "octocat"
#     dest: "/home/myuser/projects"
#     user: myuser
#     group: myuser
#     # Optional: also clone archived public repos (default: false).
#     include_archived: false
#     # Optional: move already-cloned archived repos into dest/.archive
#     # (default: false). Takes precedence over include_archived for archived
#     # repos, so they are relocated rather than (re)cloned.
#     archive_mode: false
#     # Optional: personal access token for authenticated API requests
#     # (raises the rate limit). Falls back to git_repos_github_token.
#     token: ""
#     # Optional: cap the number of repositories cloned (0 = no limit,
#     # default). Useful for testing.
#     limit: 0
git_repos: []

# Default branch used when a repository's branch cannot be determined (no
# 'version' set and the remote default branch could not be detected). Each
# repository is created as an empty "shim" (initialised repo with the remote and
# branch tracking configured but no content fetched); running `git pull` inside
# the directory populates it. Already-cloned repositories are left untouched.
git_repos_default_branch: main

# Base URL for the GitHub REST API (override for GitHub Enterprise).
git_repos_github_api_url: "https://api.github.com"

# Maximum number of API result pages (100 repos each) to fetch per github_user
# entry. Increase if a user owns more than this many repositories.
git_repos_github_max_pages: 5

# Default token used for authenticated GitHub API requests when a github_user
# entry does not define its own 'token'. Leave empty for unauthenticated
# requests (subject to a lower rate limit).
git_repos_github_token: ""
