---
# Tasks for System Setup role
- name: Ensure ansible user exists
  ansible.builtin.user:
    name: "{{ ansible_user_name }}"
    groups: "{{ ansible_user_groups }}"
    shell: "{{ ansible_user_shell }}"
    create_home: "{{ ansible_user_create_home }}"
    append: true
    state: present
  tags: [system_setup, ansible_user]

- name: Configure passwordless sudo for ansible user
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ ansible_user_name }}"
    mode: "0440"
    validate: "visudo -cf %s"
  when: ansible_user_passwordless_sudo
  tags: [system_setup, ansible_user, sudo]

- name: Ensure SSH service is enabled and running
  ansible.builtin.systemd:
    name: "{{ ssh_service_name }}"
    enabled: true
    state: started
  when: ensure_ssh_service
  tags: [system_setup, ssh]

- name: Ensure sshd includes its drop-in configuration directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include {{ sshd_config_dir }}/*.conf"
    regexp: '^\s*Include\s+{{ sshd_config_dir | regex_escape }}/\*\.conf\s*$'
    insertbefore: BOF
    validate: "/usr/sbin/sshd -t -f %s"
  when:
    - sshd_accept_env_enabled | bool
    - sshd_ensure_include_dropins | bool
    - sshd_accept_env_vars | length > 0
  notify: Reload SSH service
  tags: [system_setup, ssh, copilot]

- name: Accept client-forwarded environment variables (e.g. Copilot CLI token)
  ansible.builtin.template:
    src: sshd-accept-env.conf.j2
    dest: "{{ sshd_config_dir }}/50-ansible-accept-env.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  when:
    - sshd_accept_env_enabled | bool
    - sshd_accept_env_vars | length > 0
  notify: Reload SSH service
  tags: [system_setup, ssh, copilot]

- name: Remove the accepted-env drop-in when disabled
  ansible.builtin.file:
    path: "{{ sshd_config_dir }}/50-ansible-accept-env.conf"
    state: absent
  when: not (sshd_accept_env_enabled | bool) or sshd_accept_env_vars | length == 0
  notify: Reload SSH service
  tags: [system_setup, ssh, copilot]

- name: Point /etc/resolv.conf to upstream resolver (non-stub)
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: disable_systemd_resolved_stub
  tags: [system_setup, dns, systemd_resolved]

- name: Disable systemd-resolved DNS stub listener
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: "^#?DNSStubListener="
    line: "DNSStubListener=no"
    create: false
  when: disable_systemd_resolved_stub
  notify: Restart systemd-resolved
  tags: [system_setup, dns, systemd_resolved]

- name: Display system setup information
  ansible.builtin.debug:
    msg: >
      System setup completed.
      Ansible user: {{ ansible_user_name }}
  tags: [system_setup]
