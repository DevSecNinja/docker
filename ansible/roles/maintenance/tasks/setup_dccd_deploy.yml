---
# Setup for dccd (Docker Compose CD) deployment cron job
- name: Ensure cron is installed
  ansible.builtin.apt:
    name: cron
    state: present

- name: Remove legacy dccd cron job
  ansible.builtin.cron:
    name: "{{ maintenance_dccd_old_cron_name }}"
    user: "{{ maintenance_dccd_user }}"
    state: absent

- name: Check for legacy dccd deployment systemd timer
  ansible.builtin.stat:
    path: /etc/systemd/system/dccd-deploy.timer
  register: maintenance_dccd_legacy_timer

- name: Stop and disable legacy dccd deployment timer
  ansible.builtin.systemd_service:
    name: dccd-deploy.timer
    enabled: false
    state: stopped
  when: maintenance_dccd_legacy_timer.stat.exists

- name: Remove legacy dccd deployment systemd timer
  ansible.builtin.file:
    path: /etc/systemd/system/dccd-deploy.timer
    state: absent
  notify: Reload systemd

- name: Create dccd deployment systemd service for manual runs
  ansible.builtin.template:
    src: dccd-deploy.service.j2
    dest: /etc/systemd/system/dccd-deploy.service
    mode: "0644"
  notify: Reload systemd

- name: Configure dccd cron MAILTO
  ansible.builtin.cron:
    name: MAILTO
    env: true
    user: "{{ maintenance_dccd_user }}"
    job: "{{ maintenance_dccd_mailto }}"
    state: "{{ 'present' if maintenance_dccd_mailto | length > 0 else 'absent' }}"

- name: Create hourly dccd commit check cron job
  ansible.builtin.cron:
    name: "{{ maintenance_dccd_cron_name }}"
    minute: "{{ maintenance_dccd_cron_minute }}"
    hour: "{{ maintenance_dccd_cron_hour }}"
    user: "{{ maintenance_dccd_user }}"
    job: >-
      /bin/bash {{ maintenance_dccd_script_path }}
      -d {{ maintenance_dccd_dir }}
      -S {{ maintenance_dccd_server_name }}
      -k {{ maintenance_dccd_age_key }}
      -x {{ maintenance_dccd_exclude }}
      -q
