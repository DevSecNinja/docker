---
# Setup for dccd (Docker Compose CD) deployment service
- name: Remove legacy dccd cron job
  ansible.builtin.cron:
    name: "{{ maintenance_dccd_old_cron_name }}"
    user: "{{ maintenance_dccd_user }}"
    state: absent
  when: maintenance_dccd_enabled

- name: Check dccd timer unit files
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: "{{ maintenance_dccd_timer_units }}"
  register: maintenance_dccd_timer_unit_files

- name: Stop and disable dccd timers
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ maintenance_dccd_timer_unit_files.results | default([]) }}"
  when:
    - not maintenance_dccd_enabled
    - item.stat.exists

- name: Create dccd deployment systemd service
  ansible.builtin.template:
    src: dccd-deploy.service.j2
    dest: /etc/systemd/system/dccd-deploy.service
    mode: "0644"
  notify: Reload systemd
  when: maintenance_dccd_enabled

- name: Create dccd deployment systemd timer
  ansible.builtin.template:
    src: dccd-deploy.timer.j2
    dest: /etc/systemd/system/dccd-deploy.timer
    mode: "0644"
  notify: Reload systemd
  when: maintenance_dccd_enabled

- name: Create quiet dccd commit check systemd service
  ansible.builtin.template:
    src: dccd-commit-check.service.j2
    dest: /etc/systemd/system/dccd-commit-check.service
    mode: "0644"
  notify: Reload systemd
  when: maintenance_dccd_enabled

- name: Create quiet dccd commit check systemd timer
  ansible.builtin.template:
    src: dccd-commit-check.timer.j2
    dest: /etc/systemd/system/dccd-commit-check.timer
    mode: "0644"
  notify: Reload systemd
  when: maintenance_dccd_enabled

- name: Enable and start dccd timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - dccd-deploy.timer
    - dccd-commit-check.timer
  when: maintenance_dccd_enabled
