---
# Setup for user-tools maintenance (chezmoi, Homebrew, mise)
- name: Create user-tools maintenance systemd service
  ansible.builtin.template:
    src: maintenance-user-tools.service.j2
    dest: /etc/systemd/system/maintenance-user-tools.service
    mode: "0644"
  notify: Reload systemd

- name: Create user-tools maintenance systemd timer
  ansible.builtin.template:
    src: maintenance-user-tools.timer.j2
    dest: /etc/systemd/system/maintenance-user-tools.timer
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

- name: Enable and start user-tools maintenance timer
  ansible.builtin.systemd_service:
    name: maintenance-user-tools.timer
    enabled: true
    state: started
