---
# Default variables for Maintenance role

# Timezone configuration
maintenance_timezone: "Europe/Amsterdam"

# Ansible Pull maintenance settings
maintenance_ansible_pull_enabled: true
maintenance_ansible_pull_repo_url: "https://github.com/DevSecNinja/docker.git"
maintenance_workdir: "/var/lib/ansible/local"
maintenance_log_dir: "/var/log/maintenance"

# Chezmoi settings
maintenance_chezmoi_binary: "/usr/local/bin/chezmoi"

# Docker image update settings
maintenance_docker_update_enabled: true
maintenance_compose_dirs:
  - "/opt/docker-compose"

# OS update settings
maintenance_os_update_enabled: true

# Daily maintenance (non-disturbing updates)
maintenance_daily_enabled: true
maintenance_daily_schedule: "20:00" # 8 PM
maintenance_daily_exclude_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Weekly maintenance (full updates with reboot)
maintenance_weekly_enabled: true
maintenance_weekly_schedule: "Sat *-*-* 08:00:00" # Saturday 8 AM
maintenance_weekly_reboot_enabled: true

# Docker maintenance (prune, health checks, log cleanup)
maintenance_docker_enabled: true
maintenance_docker_schedule: "monthly" # First day of each month at midnight

# User-tools maintenance (chezmoi dotfiles, Homebrew formulae, mise tools)
# Runs weekly after the Saturday reboot to refresh user-managed tooling.
# Order: chezmoi update -> brew update/upgrade -> mise install
# (chezmoi may ship updated mise.toml / Brewfile, so it must run first.)
maintenance_user_tools_enabled: true
maintenance_user_tools_schedule: "Sun *-*-* 09:00:00" # Sunday 9 AM

# User running these tools. Defaults derived from other roles' vars,
# falling back to ansible_user.
maintenance_user_tools_user: >-
  {{ chezmoi_user | default(homebrew_user | default(mise_user |
  default(ansible_user))) }}

# Toggle individual steps (all default true; auto-skip if tool absent)
maintenance_user_tools_chezmoi_enabled: true
maintenance_user_tools_brew_enabled: true
maintenance_user_tools_mise_enabled: true

# Brew prefix (Linuxbrew default)
maintenance_user_tools_brew_prefix: "/home/linuxbrew/.linuxbrew"

# Docker prune settings
maintenance_docker_prune_enabled: true

# Set to false on hosts that use devcontainer prebuild to preserve prewarmed
# stopped containers (and the images referenced by them)
maintenance_docker_prune_containers_enabled: true

# Volume prune is disabled by default to prevent accidental data loss
maintenance_docker_volume_prune_enabled: false

# Restart containers that report unhealthy status
maintenance_docker_restart_unhealthy: true

# Truncate container log files exceeding this size
maintenance_docker_log_cleanup_enabled: true
maintenance_docker_log_max_size: "100m"

# dccd (Docker Compose CD) deployment service
maintenance_dccd_enabled: false
maintenance_dccd_schedule: "*-*-* 00:00:00" # Daily at midnight
maintenance_dccd_quiet_schedule: "*-*-* *:00:00" # Hourly
maintenance_dccd_script_path: "/opt/apps/scripts/dccd.sh"
maintenance_dccd_user: "jean-paul"
maintenance_dccd_dir: "/opt/apps"
maintenance_dccd_age_key: "/opt/apps/age.key"
maintenance_dccd_exclude: "shared"
maintenance_dccd_old_cron_name: "Run dccd for truenas-apps"
