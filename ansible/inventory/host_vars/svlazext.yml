---
# Host-specific variables for svlazext

# Environment classification
server_environment: production

# GitHub username for SSH keys installation
github_ssh_keys_username: DevSecNinja

# User that will receive the SSH keys from GitHub
github_ssh_keys_target_user: jean-paul

# Ensure only GitHub SSH Keys are kept, removes other SSH keys
github_ssh_keys_exclusive: true

# Chezmoi dotfiles user
chezmoi_user: jean-paul

# Server features to enable
server_features:
  - system_setup
  - github_ssh_keys
  - docker
  - ufw
  - package_managers
  - chezmoi
  - ansible_pull_setup
  - maintenance
  - packages
  - git_repos

# Disable systemd-resolved stub listener so Adguard can bind port 53
disable_systemd_resolved_stub: true

# Packages to install
packages_apt:
  - jq

# Git repositories to clone and keep up to date
git_repos:
  - repo: "https://github.com/DevSecNinja/truenas-apps"
    dest: "/opt/apps"
    version: main
    user: jean-paul
    group: jean-paul

# dccd deployment
maintenance_dccd_enabled: true

# Docker Compose modules to deploy
compose_modules: []

# Users to add to docker group
docker_users:
  - ansible
  - jean-paul
