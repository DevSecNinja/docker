---
# Host-specific variables for svldev

# Environment classification
server_environment: development

# GitHub username for SSH keys installation
github_ssh_keys_username: DevSecNinja

# User that will receive the SSH keys from GitHub
github_ssh_keys_target_user: jean-paul

# Ensure only GitHub SSH Keys are kept, removes other SSH keys
github_ssh_keys_exclusive: true

# Chezmoi dotfiles user
chezmoi_user: jean-paul

# Homebrew is used interactively by the dotfiles user.
homebrew_user: jean-paul

# Mise version manager
install_mise: true
mise_user: jean-paul

# Devcontainer prebuild
devcontainer_prebuild_user: jean-paul

# Keep stopped devcontainer containers so VS Code can fast-attach;
# their referenced images are also protected from image prune
maintenance_docker_prune_containers_enabled: false

# Server features to enable
server_features:
  - system_setup
  - github_ssh_keys
  - docker
  - ufw
  - package_managers
  - chezmoi
  - ansible_pull_setup
  - maintenance
  - packages
  - git_repos
  - devcontainer_prebuild

# Packages to install
packages_apt:
  - git-lfs
  - jq

# Git repositories to clone and keep up to date
git_repos:
  - repos:
      - "https://github.com/DevSecNinja/.github"
      - "https://github.com/DevSecNinja/about-me"
      - "https://github.com/DevSecNinja/blog"
      - "https://github.com/DevSecNinja/cleaning-coach"
      - "https://github.com/DevSecNinja/deck-engine"
      - "https://github.com/DevSecNinja/deckio-digital-security"
      - "https://github.com/DevSecNinja/deckio-starter"
      - "https://github.com/DevSecNinja/docker"
      - "https://github.com/DevSecNinja/dotfiles"
      - "https://github.com/DevSecNinja/ESPHome-Zehnder-RF"
      - "https://github.com/DevSecNinja/gatus-sidecar"
      - "https://github.com/DevSecNinja/gpt-prompts"
      - "https://github.com/DevSecNinja/hadiscover"
      - "https://github.com/DevSecNinja/home-assistant-config"
      - "https://github.com/DevSecNinja/m365-consolidation"
      - "https://github.com/DevSecNinja/Office365AliasModule"
      - "https://github.com/DevSecNinja/python-bandit-scan"
      - "https://github.com/DevSecNinja/subgrid"
      - "https://github.com/DevSecNinja/travel-prep"
      - "https://github.com/DevSecNinja/truenas-apps"
      - "https://github.com/DevSecNinja/v60-recipe"
      - "https://github.com/DevSecNinja/vidaud"
      - "https://github.com/DevSecNinja/wazzup"
    dest: "/home/jean-paul/projects"
    user: jean-paul
    group: jean-paul

# Docker Compose modules to deploy
compose_modules: []

# Users to add to docker group
docker_users:
  - ansible
  - jean-paul
